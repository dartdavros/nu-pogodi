<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16181b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ну, погоди! — Электроника ИМ-02</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <svg id="device" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet"
         role="application" aria-label="Игра «Ну, погоди!»: Волк ловит яйца">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eceef0"/>
          <stop offset=".5" stop-color="#d3d6da"/>
          <stop offset="1" stop-color="#b3b7bd"/>
        </linearGradient>
        <linearGradient id="gTrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d4412f"/>
          <stop offset="1" stop-color="#9e2a1d"/>
        </linearGradient>
        <linearGradient id="gLcd" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d0d6b8"/>
          <stop offset="1" stop-color="#b5bd9b"/>
        </linearGradient>
        <radialGradient id="gBtn" cx=".38" cy=".32" r=".75">
          <stop offset="0" stop-color="#ff9a6e"/>
          <stop offset=".55" stop-color="#e2472c"/>
          <stop offset="1" stop-color="#9c2416"/>
        </radialGradient>
        <radialGradient id="gBtnDown" cx=".5" cy=".55" r=".7">
          <stop offset="0" stop-color="#d64a30"/>
          <stop offset="1" stop-color="#7c1a0f"/>
        </radialGradient>
        <linearGradient id="gPill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4a4e55"/>
          <stop offset="1" stop-color="#2a2d32"/>
        </linearGradient>
        <radialGradient id="gRing" cx=".5" cy=".5" r=".5">
          <stop offset=".8" stop-color="#8e939a"/>
          <stop offset="1" stop-color="#6b7077"/>
        </radialGradient>
        <clipPath id="lcdClip"><rect x="0" y="0" width="890" height="690" rx="8"/></clipPath>
        <clipPath id="wolfTorsoClip" clipPathUnits="userSpaceOnUse">
          <path d="M418,324 C440,314 488,314 508,324 L516,440 C516,472 502,502 470,506 L442,506 C414,502 402,472 404,440 Z"/>
        </clipPath>
        <g id="arrowIcon"><path d="M0,-22 L20,6 L8,6 L8,22 L-8,22 L-8,6 L-20,6 Z"/></g>
      </defs>

      <!-- Корпус -->
      <rect x="14" y="22" width="1584" height="784" rx="72" fill="#000" opacity=".35"/>
      <rect x="8" y="8" width="1584" height="784" rx="72" fill="url(#gBody)" stroke="#8c9096" stroke-width="4"/>
      <rect x="24" y="24" width="1552" height="752" rx="58" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
      <rect x="320" y="20" width="960" height="760" rx="40" fill="url(#gTrim)"/>
      <rect x="335" y="35" width="930" height="730" rx="28" fill="#222428"/>

      <!-- LCD-экран: игровая сцена строится в js/view.js -->
      <g transform="translate(355 55)" clip-path="url(#lcdClip)">
        <rect width="890" height="690" fill="url(#gLcd)"/>
        <g id="lcd-scene"></g>
        <rect width="890" height="690" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="6"/>
      </g>

      <!-- Левая панель -->
      <text class="brand" x="165" y="80" text-anchor="middle" textLength="236" lengthAdjust="spacingAndGlyphs">ЭЛЕКТРОНИКА</text>
      <g class="pill" data-action="sound" role="button" aria-label="Звук">
        <rect class="pill-hit" x="40" y="100" width="250" height="92" rx="20"/>
        <rect class="pill-face" x="58" y="110" width="214" height="70" rx="35"/>
        <g transform="translate(90 145)" class="pill-icon">
          <path d="M-14,-8 H-6 L6,-18 V18 L-6,8 H-14 Z"/>
          <path d="M11,-9 Q18,0 11,9" fill="none" stroke-width="4" stroke-linecap="round"/>
          <path id="sound-slash" d="M-18,16 L18,-16" fill="none" stroke-width="5" stroke-linecap="round" style="display:none"/>
        </g>
        <text id="sound-label" class="pill-label sound-text" x="190" y="153" text-anchor="middle">ЗВУК ВКЛ</text>
      </g>
      <g class="grille" fill="#8b9097">
        <circle cx="105" cy="214" r="5"/><circle cx="135" cy="214" r="5"/><circle cx="165" cy="214" r="5"/><circle cx="195" cy="214" r="5"/><circle cx="225" cy="214" r="5"/>
        <circle cx="120" cy="238" r="5"/><circle cx="150" cy="238" r="5"/><circle cx="180" cy="238" r="5"/><circle cx="210" cy="238" r="5"/>
      </g>

      <!-- Правая панель -->
      <text class="device-title" x="1435" y="82" text-anchor="middle" textLength="250" lengthAdjust="spacingAndGlyphs">НУ, ПОГОДИ!</text>
      <g class="pill" data-action="start" role="button" aria-label="Старт">
        <rect class="pill-hit" x="1310" y="100" width="250" height="84" rx="20"/>
        <rect class="pill-face" x="1328" y="108" width="214" height="66" rx="33"/>
        <text class="pill-label" x="1435" y="151" text-anchor="middle">СТАРТ</text>
      </g>
      <g class="pill" data-action="pause" role="button" aria-label="Пауза">
        <rect class="pill-hit" x="1310" y="184" width="250" height="84" rx="20"/>
        <rect class="pill-face" x="1328" y="192" width="214" height="66" rx="33"/>
        <text id="pause-label" class="pill-label" x="1435" y="235" text-anchor="middle">ПАУЗА</text>
      </g>

      <!-- Игровые кнопки: 0 верх-лево, 1 низ-лево, 2 верх-право, 3 низ-право -->
      <g class="gbtn" data-btn="0" transform="translate(165 362)">
        <circle class="ring" r="92"/>
        <g class="cap"><circle class="cap-face" r="76"/>
          <text class="key-label" y="17" text-anchor="middle">Q</text>
          <use class="touch-label" href="#arrowIcon" transform="rotate(-45)"/></g>
      </g>
      <g class="gbtn" data-btn="1" transform="translate(165 612)">
        <circle class="ring" r="92"/>
        <g class="cap"><circle class="cap-face" r="76"/>
          <text class="key-label" y="17" text-anchor="middle">A</text>
          <use class="touch-label" href="#arrowIcon" transform="rotate(-135)"/></g>
      </g>
      <g class="gbtn" data-btn="2" transform="translate(1435 362)">
        <circle class="ring" r="92"/>
        <g class="cap"><circle class="cap-face" r="76"/>
          <text class="key-label" y="17" text-anchor="middle">P</text>
          <use class="touch-label" href="#arrowIcon" transform="rotate(45)"/></g>
      </g>
      <g class="gbtn" data-btn="3" transform="translate(1435 612)">
        <circle class="ring" r="92"/>
        <g class="cap"><circle class="cap-face" r="76"/>
          <text class="key-label" y="17" text-anchor="middle">L</text>
          <use class="touch-label" href="#arrowIcon" transform="rotate(135)"/></g>
      </g>
      <text class="caption" x="165" y="752" text-anchor="middle">ИМ-02</text>
      <text class="caption" x="1435" y="752" text-anchor="middle">ЯЙЦА · ВОЛК</text>
    </svg>
  </div>

  <!-- Сообщение для портретной ориентации на телефонах и планшетах -->
  <div id="rotate" role="alert">
    <svg class="rotate-icon" viewBox="0 0 200 200" aria-hidden="true">
      <g class="rotate-phone">
        <rect x="70" y="30" width="60" height="110" rx="10" fill="none" stroke="#e9ecef" stroke-width="6"/>
        <rect x="78" y="44" width="44" height="78" rx="3" fill="#c6ccae"/>
        <circle cx="100" cy="131" r="4" fill="#e9ecef"/>
        <ellipse cx="100" cy="86" rx="7" ry="9" fill="#1b2317"/>
      </g>
      <path d="M44,152 A70,70 0 0 0 156,152" fill="none" stroke="#e2472c" stroke-width="6" stroke-linecap="round"/>
      <path d="M156,152 L140,150 M156,152 L158,136" fill="none" stroke="#e2472c" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <p class="rotate-title">Поверните устройство горизонтально</p>
    <p class="rotate-sub">«Ну, погоди!» играется в альбомной ориентации — так удобнее нажимать кнопки двумя большими пальцами.</p>
  </div>

  <noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>

  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/view.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
